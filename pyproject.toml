[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "extractoryt"
version = "0.1.0"
description = "High-fidelity YouTube transcript & audio-to-text extraction pipeline with offline ASR fallback."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "openfolioLM team" }
]
keywords = [
    "youtube",
    "transcript",
    "subtitles",
    "whisper",
    "speech-to-text",
    "asr",
    "yt-dlp",
    "audio",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]
dependencies = [
    "youtube-transcript-api>=0.6.0",
    "httpx>=0.24.0",
    "yt-dlp>=2023.0.0",
]

[project.optional-dependencies]
asr = [
    "sherpa-onnx>=1.10.0",
    "av>=11.0.0",
    "numpy>=1.20.0",
]
faster-whisper = [
    "faster-whisper>=1.0.0",
    "av>=11.0.0",
    "numpy>=1.20.0",
]
cli = [
    "rich>=13.0.0",
]
all = [
    "sherpa-onnx>=1.10.0",
    "faster-whisper>=1.0.0",
    "av>=11.0.0",
    "numpy>=1.20.0",
    "rich>=13.0.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
extractoryt = "extractoryt.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/extractoryt"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
